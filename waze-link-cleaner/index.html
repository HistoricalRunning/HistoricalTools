<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניקוי קישורי Waze</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1821;color:#effaff;padding:20px;font:16px system-ui,Arial}main{width:min(100%,650px)}h1{font-size:30px}p,small{color:#b6c9d5;line-height:1.6}.card{background:#172b38;border:1px solid #365062;border-radius:18px;padding:26px}label{display:block;font-weight:700;margin:16px 0 8px}textarea,input[type=text]{width:100%;background:#0b1d29;color:#fff;border:1px solid #527184;border-radius:10px;padding:13px;font:inherit;direction:ltr;text-align:left}textarea{min-height:110px}button{border:0;border-radius:10px;padding:13px 17px;font:inherit;font-weight:700;cursor:pointer;background:#50d4ee;color:#08222c}button.secondary{background:#344d60;color:#fff}button:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.row button{flex:1;min-width:170px}.hidden{display:none}.check{display:flex;gap:10px;align-items:flex-start;margin-top:19px}input[type=checkbox]{accent-color:#50d4ee;margin-top:5px}.info{background:#102431;border-radius:9px;padding:13px;margin-top:14px}.success{color:#7af2b3}.error{color:#ffaaaa}footer{margin-top:20px;font-size:13px;color:#8aa9b9}</style></head><body><main><p style="color:#50d4ee">HISTORICAL TOOLS · WAZE</p><h1>ניקוי קישור לנקודה ב־Waze</h1><p>הדבק קישור Waze והפק קישור נקי שמכיל רק את הנקודה (ll), ללא פרמטרים נוספים.</p><section class="card"><label for="source">קישור Waze מקורי</label><textarea id="source" spellcheck="false" placeholder="https://ul.waze.com/ul?ll=32.07977746%2C35.09473961&navigate=yes"></textarea><div class="row"><button id="clean">נקה קישור</button><button class="secondary" id="reset">איפוס</button></div><div id="output" class="hidden"><label for="result">קישור נקי</label><input id="result" type="text" readonly><div id="coords" class="info"></div><div class="row"><button id="test">פתח ב־Waze לבדיקה ↗</button></div><label class="check"><input type="checkbox" id="verified"><span>בדקתי שהנקודה נכונה</span></label><div class="row"><button class="secondary" id="copy" disabled>העתק קישור</button></div></div><p id="status" role="status" aria-live="polite"></p></section><footer>העיבוד מתבצע בדפדפן בלבד. פתיחת Waze תלויה בהגדרות המכשיר.</footer></main><script>
"use strict";const $=id=>document.getElementById(id);let current="";
function parse(s){s=s.trim().replace(/&amp;/gi,"&");if(!s)throw Error("יש להזין קישור.");let u;try{u=new URL(s)}catch{throw Error("הקישור אינו תקין.")}if(!["https:","http:"].includes(u.protocol)||!["ul.waze.com","waze.com","www.waze.com"].includes(u.hostname.toLowerCase()))throw Error("נדרש קישור Waze תקין.");const ll=u.searchParams.get("ll");if(!ll)throw Error("לא נמצא פרמטר ll.");const a=ll.split(",").map(x=>x.trim());if(a.length!==2||a.some(x=>!/^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(x)))throw Error("קואורדינטות לא תקינות.");const lat=Number(a[0]),lon=Number(a[1]);if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)throw Error("הקואורדינטות מחוץ לטווח.");return {url:"https://ul.waze.com/ul?ll="+encodeURIComponent(a.map(x=>String(Number(x))).join(",")),lat,lon}}
function status(m,error=false){$("status").textContent=m;$("status").className=error?"error":"success"}
function clear(){current="";$("output").classList.add("hidden");$("verified").checked=false;$("copy").disabled=true}
$("clean").onclick=()=>{clear();try{const x=parse($("source").value);current=x.url;$("result").value=x.url;$("coords").textContent="קו רוחב: "+x.lat+" | קו אורך: "+x.lon;$("output").classList.remove("hidden");status("הקישור נוקה. פתח אותו לבדיקה, ולאחר מכן אשר כדי להעתיק.")}catch(e){status(e.message,true)}};
$("source").oninput=()=>{if(current){clear();status("הקישור שונה; יש לנקות ולבדוק מחדש.")}};
$("reset").onclick=()=>{$("source").value="";clear();status("")};
$("test").onclick=()=>{if(current){window.open(current,"_blank","noopener,noreferrer");status("לאחר הבדיקה ב־Waze, חזור ואשר שהנקודה נכונה.")}};
$("verified").onchange=()=>{$("copy").disabled=!$("verified").checked||!current;status($("verified").checked?"ניתן כעת להעתיק את הקישור.":"יש לאשר את הנקודה.")};
$("copy").onclick=async()=>{if(!current||!$("verified").checked)return;try{await navigator.clipboard.writeText(current);status("הקישור הועתק.")}catch{const i=$("result");i.focus();i.select();status("העתקה אוטומטית אינה זמינה. העתק את הטקסט המסומן.",true)}};
</script></body></html>
